# Builds the Android module APK. Repo layout: android/ (Gradle project), windows/ (Python daemon).
#
# Secrets (Settings > Secrets and variables > Actions):
#   CLIPSYNC_HOST  - your PC's DDNS hostname
#   CLIPSYNC_PSK   - 64 hex chars, same as windows/clipsync.ini
#   CLIPSYNC_PORT  - optional, default 47521
#   CLIPSYNC_MODE  - optional: ddns+mdns (default) | ddns | mdns
#   KEYSTORE_B64       - base64 of your personal keystore (see below)
#   KEYSTORE_PASSWORD  - store password
#   KEY_ALIAS          - optional, defaults to the store's only alias
#   KEY_PASSWORD       - optional, defaults to KEYSTORE_PASSWORD (PKCS12 has one password)
# Forks without secrets still build; the APK then reads /data/data/io.github.lcebot.clipsync/files/clipsync.conf at runtime.
#
# NOTE: this repo is public and the release job attaches the APK to a public Release. CLIPSYNC_PSK and
# CLIPSYNC_HOST are compiled into BuildConfig, so setting those secrets would publish them inside a
# downloadable APK. Leave them unset and configure the app on the device instead.
#
# Make the keystore once, keep it offline, never commit it. No JDK needed — PowerShell writes a
# PKCS12 directly (see README / the commands below), then base64 it into KEYSTORE_B64:
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("clipsync.p12")) | Set-Clipboard
# Not certutil -encode (it wraps the output in BEGIN/END lines) and not > / Out-File (PowerShell 5
# writes UTF-16 with a BOM); paste straight from the clipboard into the secret.
# KEY_ALIAS may be left unset — the build reads the store's only alias.
# Losing this file means no device can ever overwrite-install the app again.
#
# Output: workflow artifact "clipsync" (app-release.apk + windows.zip). Publishing a release on
# GitHub runs the same build and attaches both files to that release — create the release with no
# files of your own and wait for the run to finish.
# Without the keystore secrets the build still succeeds, but produces app-release-unsigned.apk,
# which cannot be installed.
name: build-apk
on:
  # Branch pushes: a CI build, artifact only. The paths filter keeps it off doc-only commits.
  push:
    branches: ["**"]
    paths: ["android/**", "windows/**", ".github/workflows/build-apk.yml"]
  # Publishing a release is what attaches the files. This is the event to listen for, not a tag
  # push: a release created in the web UI makes its tag through the API, and a "push" with both a
  # tags and a paths filter is unreliable anyway — a tag pointing at an already-pushed commit has
  # no changed files for the paths filter to match, so the run is skipped.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK at $ANDROID_HOME with licenses accepted;
      # AGP downloads platform 35 / build-tools itself. (android-actions/setup-android@v3
      # fails on current images trying to install the removed 'tools' package.)
      - name: install SDK components
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;36.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"          # AGP 9.x needs Gradle 9.x; 9.6 covers the whole line

      # Secrets win; otherwise a committed android/clipsync.properties (private repos) is used as-is.
      - name: write clipsync.properties from secrets
        env:
          HOST: ${{ secrets.CLIPSYNC_HOST }}
          PORT: ${{ secrets.CLIPSYNC_PORT }}
          PSK: ${{ secrets.CLIPSYNC_PSK }}
          MODE: ${{ secrets.CLIPSYNC_MODE }}
        run: |
          if [ -n "$PSK" ]; then
            printf 'host=%s\nport=%s\npsk=%s\nmode=%s\n' "$HOST" "${PORT:-47521}" "$PSK" "${MODE:-ddns+mdns}" > clipsync.properties
            echo "using secrets"
          elif [ -f clipsync.properties ]; then
            echo "using committed clipsync.properties"
          else
            echo "no config: APK will need /data/data/io.github.lcebot.clipsync/files/clipsync.conf at runtime"
          fi

      # Decoded into RUNNER_TEMP, never into the workspace: nothing here can end up in an artifact.
      - name: decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "no keystore secret: the release APK will be unsigned"
            exit 0
          fi

          # Keep only base64 alphabet characters. GNU base64 rejects the entire input over a single
          # stray byte ("invalid input"), and a secret pasted from Windows routinely carries a CR,
          # a BOM, or certutil's BEGIN/END armour. Dropping the rest is safe: what survives is
          # still verified below, so a genuinely wrong secret cannot slip through.
          clean=$(printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=')
          printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/clipsync.p12" 2>/dev/null || true

          # A PKCS12 is a DER SEQUENCE, so the file starts with 30 82 — and its base64 with "MII".
          if ! head -c2 "$RUNNER_TEMP/clipsync.p12" | od -An -tx1 | grep -q '30 82'; then
            echo "KEYSTORE_B64 does not decode to a PKCS12. Diagnostics (no secret content):"
            echo "  characters received:       ${#KEYSTORE_B64}"
            echo "  left after filtering:      ${#clean}"
            echo "  starts with MII:           $(case "$clean" in MII*) echo yes;; *) echo no;; esac)"
            echo "  length is a multiple of 4: $(( ${#clean} % 4 == 0 ))"
            echo "  decoded bytes:             $(wc -c < "$RUNNER_TEMP/clipsync.p12")"
            echo
            echo "Expected: a few thousand characters, starting with MII."
            echo 'Re-copy with: [Convert]::ToBase64String([IO.File]::ReadAllBytes("clipsync.p12")) | Set-Clipboard'
            echo "and paste straight into the secret - no file, no certutil."
            exit 1
          fi

          echo "KEYSTORE_FILE=$RUNNER_TEMP/clipsync.p12" >> "$GITHUB_ENV"
          echo "signing with the keystore secret ($(wc -c < "$RUNNER_TEMP/clipsync.p12") bytes)"

      - name: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      # The PC side ships as a zip built from a named list — never by zipping the folder, which
      # would sweep up clipsync.log, install-state.json and received/ as well.
      #
      # clipsync.ini comes from the checkout, where it is committed with an empty psk and no host.
      # That is the file a release must contain, and it is also the one to be careful with: it is
      # tracked, so .gitignore cannot protect it from a local edit. Keep your own values out of a
      # commit with
      #     git update-index --skip-worktree windows/clipsync.ini
      # which leaves the clean version in the repository and stops your working copy being staged.
      - name: package the PC side
        working-directory: windows
        run: |
          # Fail on something that looks like a real key rather than demanding an exactly blank
          # line, so a placeholder or a reworded comment never blocks a release by accident.
          if grep -qiE '^[[:space:]]*psk[[:space:]]*=[[:space:]]*[0-9a-f]{32,}' clipsync.ini; then
            echo "windows/clipsync.ini carries a real-looking psk — refusing to publish it."
            echo "See the note above this step: the committed file must ship blank."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pc"
          cp clipsync.py install.ps1 uninstall.ps1 requirements.txt clipsync.ini "$RUNNER_TEMP/pc/"
          (cd "$RUNNER_TEMP/pc" && zip -q -r "$GITHUB_WORKSPACE/windows.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: clipsync
          path: |
            android/app/build/outputs/apk/release/*.apk
            windows.zip

      # On a release event this attaches to the release that was just published.
      - name: attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            windows.zip
